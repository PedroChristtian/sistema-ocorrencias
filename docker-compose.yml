services:
  postgres:
    image: postgres:16-alpine
    container_name: municipio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: municipio
      POSTGRES_PASSWORD: municipio123
      POSTGRES_DB: municipio_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
